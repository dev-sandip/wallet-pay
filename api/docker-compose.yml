
services:
  postgres:
    image: postgres:16
    container_name: wallet_pay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: wallet_pay
    ports:
      - "5432:5432"
    volumes:
      - wallet_pay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d wallet_pay"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  wallet_pay_postgres_data:
